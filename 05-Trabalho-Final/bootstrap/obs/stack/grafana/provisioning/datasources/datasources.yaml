# Tres fontes ligadas entre si, todas internas ao compose (access: proxy = o
# servidor do Grafana consulta; o navegador do aluno so fala com a porta 3000).
#   log (Loki)    -> trace (Jaeger) pelo trace_id da linha JSON
#   trace (Jaeger) -> logs (Loki) do mesmo trace_id
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # Link interno para o Jaeger: no detalhe do log aparece o botao do trace.
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '"trace_id": ?"([0-9a-f]{32})"'
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: "Ver o trace no Jaeger"

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service_name="qc-rag"} |= "$${__trace.traceId}"'
